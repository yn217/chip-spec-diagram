# AI 推論アクセラレータ(架空)。2 枚積層: ロジックダイ(回路面 上)の上に、メモリダイ(回路面 下)を貼り合わせ。
# 1 つのモデルから、全体図・層ごとの図・動作説明(同じ図を薄くして使い回す)・切り出し・別図(BIST・クロック・ブロックの中の回路)を作る。
# 全体図の描き方は、論文・ホワイトペーパーのブロック図にならう: バス = 帯、ブロックは短い太い矢印でバスにつなぐ、ポートの札、サブシステムの枠。
title: 推論アクセラレータ XA-1(架空)アーキテクチャ全体図
view: top                      # 視点: top = 上面(放熱側)から透視 / bottom = バンプ側から
grid: [12, 9]                  # マス目(列, 行)。座標は「上面から見た向き」で書く(左上が [0, 0])
focus: [data, ctrl]            # 全体図に描く線の種類。ほかの種類(test・clk)は別図 arch_focus_<種類> に同じ配置で描く
small_kinds: [clk, pwr, test]  # 名前だけの小さい箱にする種類(データの流れに関係が薄い)。個別には small: true / false
stack:                         # 下(基板側)から順。free = わざと空けてあるマス(配線・電源の通り道)
  - {id: L1, name: ロジックダイ, face: up, note: "5nm・TSV で裏面のバンプへ"}
  - {id: L2, name: メモリダイ, face: down, flip: y, at: [2, 2, 8, 6], free: [[2, 4, 8, 1]], note: "SRAM 専用プロセス・縦軸まわりに裏返して貼る"}
bonds:
  - {between: [L1, L2], type: HB, note: "ハイブリッドボンディング 6µm ピッチ(F2F)"}
clocks:
  - {id: clk_core, freq: 2GHz, from: pll0, note: 演算・スパイン}
  - {id: clk_host, freq: 1GHz, from: pll0, note: "PCIe コントローラ・DMA(clk_core ÷2)"}
  - {id: clk_csr, freq: 250MHz, from: pll0, note: "設定・管理(÷8)"}
  - {id: clk_link, freq: 1.75GHz, from: pll1, note: スケールアウトリンク}
  - {id: clk_mem, freq: 2GHz, from: pll0, note: "メモリダイ(HB 経由で clk_core を配る)"}
groups:                        # サブシステムの枠(題つきの薄い色の地)
  - {name: ホスト I/F, color: "#15803d", blocks: [host_phy, host_ctl, dma, obuf]}
  - {name: 制御, color: "#6d28d9", blocks: [sched, stat, csr]}
  - {name: 演算クラスタ(タイル ×8 + 真上の重みメモリ), color: "#1d4ed8", blocks: ["tile*", spine, post]}
  - {name: スケールアウト, color: "#0f766e", blocks: [link_ctl, link_fec, link_phy, sync]}
  - {name: クロック・電源・テスト, color: "#a16207", blocks: [pll0, pll1, ckgen, pmu, thermal, jtag, vreg]}
blocks:
  # ---- バス(帯)。shape: bus、bus: data | ctrl(帯の色)----
  - {id: mbus, die: L1, at: [0, 0, 12, 1], name: 管理バス(CSR), shape: bus, bus: ctrl, kind: ctrl, clock: clk_csr, info: ["32b アドレス・32b データ", "ホスト・I2C・ブートのどれからも読み書き"]}
  - {id: spine, die: L1, at: [2, 4, 8, 1], name: ストリームスパイン(10 ポート クロスバー), shape: bus, bus: data, kind: ctrl, clock: clk_core, info: ["各ポート 512b・クレジット方式", "同時 8 経路"]}
  # ---- L1 ロジックダイ ----
  - {id: gpio, die: L1, at: [0, 1, 1, 1], name: 管理 I/F, kind: io, clock: clk_csr, info: ["I2C スレーブ 1MHz", "SPI マスタ 50MHz"]}
  - {id: host_phy, die: L1, at: [0, 2, 1, 5], name: PCIe PHY, kind: io, clock: clk_host, info: ["Gen6 ×16", "64Gb/s/レーン", "PAM4"],
     inside_dir: v, inside_flow: false, inside: ["レーン 0–3|TX/RX ×4", "レーン 4–7|TX/RX ×4", "レーン 8–11|TX/RX ×4", "レーン 12–15|TX/RX ×4", "等化 CTLE・DFE|FFE 5 タップ", "CDR・基準 100MHz|PCS 128b/130b"]}
  - {id: host_ctl, die: L1, at: [1, 1, 1, 3], name: PCIe コントローラ, kind: io, clock: clk_host, info: ["MAC/DLL/TL", "FLIT モード"],
     inside_dir: v, inside_flow: false, inside: ["PIPE I/F|128b/130b", "mem:再送バッファ|CRC・ACK/NAK", "TLP 組立|BAR 復号"]}
  - {id: dma, die: L1, at: [1, 4, 1, 3], name: DMA・重み展開, kind: ctrl, clock: clk_host, info: ["clk_host ⇔ clk_core"],
     inside_dir: v, inside_flow: false, inside: ["fifo:入力 8MB", "復号器 ×8|エントロピー", "fifo:非同期(CDC)", "fifo:出力 2MB"]}
  - {id: obuf, die: L1, at: [0, 7, 2, 1], name: 出力バッファ, kind: ctrl, clock: clk_core, info: ["結果を貯めて DMA へ"],
     inside_at: [0.45, 1], inside_flow: false, inside: ["fifo:結果 2MB", "整形|256b→1024b"]}
  - {id: sched, die: L1, at: [2, 1, 3, 1], name: スケジューラ(マイクロコード), kind: ctrl, clock: clk_core, info: ["命令メモリ 1MB", "レイヤ単位のシーケンス・タイル割り当て"]}
  - {id: stat, die: L1, at: [5, 1, 2, 1], name: 統計・トレース, kind: ctrl, clock: clk_csr, info: ["性能カウンタ 256 本", "トレース 4MB"]}
  - {id: csr, die: L1, at: [7, 1, 3, 1], name: 設定レジスタ(CSR), kind: ctrl, clock: clk_csr, info: ["設定 1024 語", "電圧・遮断・クロックの設定を配る"]}
  - {id: "tile{i}", die: L1, at: [2, 2, 2, 2], array: [4, 2], pitch: [2, 3], name: "演算タイル {i}", kind: compute, clock: clk_core,
     info: ["乗算器 256 個(INT8)", "作業 SRAM 2MB", "ピーク 2TOPS"],
     inside_flow: false, inside: ["fifo:入力", "mem:作業SRAM|2MB", "演算器 3 種|切り替え", "結果|レジスタ", "fifo:出力"]}
  - {id: post, die: L1, at: [2, 7, 8, 1], name: 集約・後処理, kind: compute, clock: clk_core, info: ["部分和の加算/最大・TopK・量子化", "出力 256b"],
     inside_at: [0.33, 0.57], inside_y: 0.44, inside_flow: false, inside: ["加算器 ×4|256b", "比較器ツリー|最大・TopK 64", "mem:指数 LUT|ROM 4K 語", "除算器|FP16", "丸め・飽和|INT8"]}
  - {id: boot, die: L1, at: [11, 1, 1, 1], name: ブート ROM, kind: ctrl, clock: clk_csr, info: ["ROM 64KB", "eFuse 4Kbit"]}
  - {id: link_ctl, die: L1, at: [10, 1, 1, 4], name: リンク制御, kind: io, clock: clk_link, info: ["スケールアウト", "8 レーン結束"],
     inside_dir: v, inside_flow: false, inside: ["fifo:非同期 core⇔link", "パケット化|ヘッダ 64b", "フロー制御|クレジット", "レーン結束|デスキュー"]}
  - {id: link_fec, die: L1, at: [10, 5, 1, 2], name: FEC・再送, kind: io, clock: clk_link, info: ["RS(544,514)"],
     inside_dir: v, inside_flow: false, inside: ["符号器・復号器", "mem:再送バッファ|1MB"]}
  - {id: link_phy, die: L1, at: [11, 2, 1, 5], name: 112G SerDes, kind: io, clock: clk_link, info: ["×8 レーン", "112Gb/s/レーン", "PAM4"],
     inside_dir: v, inside_flow: false, inside: ["レーン 0–3|TX/RX ×4", "レーン 4–7|TX/RX ×4", "等化 FFE・DFE|ADC 方式", "CDR・逓倍 PLL|基準 156.25MHz"]}
  - {id: sync, die: L1, at: [10, 7, 2, 1], name: チップ間同期, kind: ctrl, clock: clk_link, info: ["SYNC パルス", "時刻 64b"]}
  # ---- L1 の下の行: データの流れに関係の薄いブロック(名前だけの小さい箱)----
  - {id: pll0, die: L1, at: [0, 8, 1, 1], name: PLL0, kind: clk}
  - {id: pll1, die: L1, at: [1, 8, 1, 1], name: PLL1, kind: clk}
  - {id: ckgen, die: L1, at: [2, 8, 2, 1], name: クロック生成・分配, kind: clk}
  - {id: pmu, die: L1, at: [4, 8, 2, 1], name: 電源管理(PMU・DVFS), kind: pwr}
  - {id: thermal, die: L1, at: [6, 8, 2, 1], name: 温度・電圧モニタ, kind: pwr}
  - {id: jtag, die: L1, at: [8, 8, 2, 1], name: JTAG・BIST 制御, kind: test}
  - {id: vreg, die: L1, at: [10, 8, 2, 1], name: LDO・電源スイッチ, kind: pwr}
  # ---- L2 メモリダイ ----
  - {id: "wmem{i}", die: L2, at: [2, 2, 2, 2], array: [4, 2], pitch: [2, 3], name: "重みメモリ {i}", kind: mem, clock: clk_mem,
     info: ["SRAM 512Mb・ECC", "読み出し 2048b"],
     inside_at: [0, 0.62], inside_y: 0.8, inside_flow: false, inside: ["行デコーダ", "mem:セル 512Mb|8 バンク", "SA 2048b"]}
  - {id: abuf, die: L2, at: [2, 7, 6, 1], name: アクティベーションバッファ, kind: mem, clock: clk_mem, info: ["SRAM 2Gb(8 バンク)・2 ポート"]}
  - {id: mbist, die: L2, at: [8, 7, 1, 1], name: BIST・救済, kind: test}
  - {id: decap, die: L2, at: [9, 7, 1, 1], name: デカップ容量, kind: pwr}
links:                           # tab = ポートの札(プロトコル・ポート名)。バスの帯につながる端に付く
  # ---- ホスト側(データ)----
  - {id: h1, from: host_phy, to: host_ctl, dir: both, lanes: 16, rate: 64Gbps, proto: PIPE}
  - {id: h2, from: host_ctl, to: dma, dir: both, width: 1024, clock: clk_host, proto: AXI-S}
  - {id: d1, from: dma, to: spine, width: 512, clock: clk_core, proto: 入力・重み, tab: P0}
  - {id: p1, from: post, to: obuf, width: 256, clock: clk_core, proto: 結果}
  - {id: p2, from: obuf, to: dma, width: 1024, clock: clk_core, proto: 結果}
  # ---- 演算(データ)----
  - {id: "t{i}", from: spine, to: "tile{i}", for: 8, dir: both, width: 512, clock: clk_core, proto: ストリーム, tab: "P{i}"}
  - {id: "r{i}", from: "tile{i}", to: post, for: [4, 5, 6, 7], width: 256, clock: clk_core, proto: 部分和}
  # ---- スケールアウト(データ)----
  - {id: k1, from: spine, to: link_ctl, dir: both, width: 512, clock: clk_core, eff: 0.75, proto: ストリーム, tab: P9}
  - {id: k2, from: link_ctl, to: link_fec, dir: both, width: 512, clock: clk_link}
  - {id: k3, from: link_fec, to: link_phy, dir: both, lanes: 8, rate: 112Gbps}
  - {id: k4, from: sync, to: link_fec, width: 64, clock: clk_link, proto: 同期, kind: ctrl}
  # ---- 管理バスにつながるもの(設定・起動コード。遅いが、ここを通らないと動かない)----
  - {id: g1, from: gpio, to: mbus, dir: half, width: 1, rate: 1MHz, proto: I2C, kind: ctrl, tab: I2C}
  - {id: b1, from: boot, to: mbus, width: 32, clock: clk_csr, proto: 起動コード, kind: ctrl, tab: ROM}
  - {id: m_h, from: host_ctl, to: mbus, dir: half, width: 32, clock: clk_csr, kind: ctrl, tab: CSR}
  - {id: m_s, from: mbus, to: sched, width: 32, clock: clk_csr, proto: マイクロコード・設定, kind: ctrl, tab: CSR}
  - {id: m_t, from: mbus, to: stat, dir: half, width: 32, clock: clk_csr, kind: ctrl, tab: CSR}
  - {id: m_c, from: mbus, to: csr, dir: half, width: 32, clock: clk_csr, kind: ctrl, tab: CSR}
  - {id: m_l, from: mbus, to: link_ctl, dir: half, width: 32, clock: clk_csr, kind: ctrl, tab: CSR}
  - {id: s0, from: sched, to: spine, width: 128, clock: clk_core, proto: 経路設定, kind: ctrl}
  # ---- 層をまたぐ接続(ハイブリッドボンディング)----
  - {id: "w{i}", from: "wmem{i}", to: "tile{i}", for: 8, via: HB, dir: both, width: 2048, clock: clk_mem, proto: 重み 読み書き}
  - {id: a1, from: post, to: abuf, via: HB, dir: both, width: 4096, clock: clk_mem, proto: "活性値 読み書き(8 バンク)"}
  # ---- テスト(全体図には描かない。別図 arch_focus_test)----
  - {id: j1, from: jtag, to: mbist, via: TSV, width: 8, clock: clk_csr, proto: BIST 制御, kind: test, far: true}
  - {id: "bt{i}", from: mbist, to: "wmem{i}", for: 8, width: 64, clock: clk_mem, proto: BIST, kind: test, mux: "通常/BIST"}
  - {id: bt8, from: mbist, to: abuf, width: 64, clock: clk_mem, proto: BIST, kind: test, mux: "通常/BIST"}
  # ---- クロック(全体図には描かない。別図 arch_focus_clk)----
  - {id: c1, from: pll0, to: ckgen, kind: clk, label: "8GHz"}
  - {id: c2, from: pll1, to: ckgen, kind: clk, label: "1.75GHz"}
  - {id: "ck{i}", from: ckgen, to: "tile{i}", for: 8, kind: clk, label: clk_core}
  - {id: c3, from: ckgen, to: host_ctl, kind: clk, label: clk_host}
  - {id: c4, from: ckgen, to: link_ctl, kind: clk, label: clk_link}
  - {id: c5, from: ckgen, to: mbus, kind: clk, label: clk_csr}
scenes:
  - id: boot
    title: 動作 0 — 起動と設定(ブート ROM・I2C)
    steps:
      - {text: "ブート ROM が起動コードを管理バスに流す", links: [b1]}
      - {text: "スケジューラがマイクロコードを受け取る", links: [m_s]}
      - {text: "外部の管理コントローラが I2C で設定を書く(1MHz、半二重)", links: [g1]}
      - {text: "設定レジスタに届き、ここから電圧・クロックの設定が配られる", links: [m_c]}
  - id: load
    title: 動作 1 — 重みのロード(ホスト → 重みメモリ 0〜2)
    steps:
      - {text: "ホストが圧縮した重みを PCIe で送る(16 レーン、128GB/s)", links: [h1, h2]}
      - {text: "DMA が復号し、clk_core に乗せ替えてスパインへ流す", links: [d1]}
      - {text: "スパインがタイル 0〜2 へ配る", links: [t0, t1, t2]}
      - {text: "タイルが真上の重みメモリへ書く(HB、2048b×2GHz)", links: [w0, w1, w2]}
  - id: infer
    title: 動作 2 — 推論 1 回(入力 → タイル 4 → 集約 → 出力)
    steps:
      - {text: "ホストが入力テンソルを送り、DMA がスパインへ流す", links: [h1, h2, d1]}
      - {text: "スケジューラがスパインの経路を設定する", links: [s0]}
      - {text: "スパインがタイル 4 へ配る", links: [t4]}
      - {text: "タイル 4 が真上の重みメモリ 4 から重みを読んで演算する(タイルの中の動きは 別図 tile)", links: [w4]}
      - {text: "部分和を集約・後処理へ。活性値はバッファへ退避(HB)", links: [r4, a1]}
      - {text: "結果を出力バッファ・DMA 経由でホストへ返す", links: [p1, p2, h2, h1]}
crops:
  - {id: tile4, title: 切り出し — 演算タイル 4 のまわり(推論の流れ), blocks: [spine, tile4, tile5, post], scene: infer}

# ---- 別図: ブロックの中の回路(階層の 1 段下)。全体図のブロックに「▸中の回路: 別図 tile」の印がつく ----
details:
  - id: tile
    of: ["tile*"]
    title: 別図 tile — 演算タイルの中の回路(データパス)
    schematic: true            # 回路図ふうに描く(記号・端子・分岐。物理配置ではない)。列の幅・行の高さは記号に合わせて自動
    grid: [9, 4]
    stack_at: {L2: [0, 0, 4, 1], L1: [0, 0, 9, 4]}
    blocks:
      # shape: mux = セレクタ(台形。out = 出力の向き)、reg = レジスタ、op = 演算器(sym = 丸の中の記号)、ram = SRAM、fifo = FIFO、なし = 箱
      # pins: {辺: [端子, …]}。既定の端子: reg は d(左)→ q(右)、fifo は in → out、op・mux の出力は y(右)
      # ---- L2 メモリダイ(重みの読み出し)----
      - {id: wdecr, die: L2, at: [0, 0, 1, 1], name: 行デコーダ, info: ["16b → 65536 行"], pins: {s: [addr]}}
      - {id: wcell, die: L2, at: [1, 0, 2, 1], name: 重み SRAM, shape: ram, info: ["2048b × 65536 語", "読み出し専用ポート"]}
      - {id: wsa, die: L2, at: [3, 0, 1, 1], name: センスアンプ, info: ["出力 REG 2048b"], clock: clk_mem, pins: {s: [q]}}
      # ---- L1 ロジックダイ: 制御 ----
      - {id: agen, die: L1, at: [4, 0, 2, 1], name: アドレス生成, info: ["読み・書きポインタ 15b", "重みアドレス 16b"], pins: {s: [waddr, raddr], w: [wadr]}}
      - {id: seq, die: L1, at: [6, 0, 3, 1], name: 制御 FSM(マイクロコード), info: ["命令 ROM 256 語", "ステップ・ループのカウンタ"], pins: {s: [op_sel, wsel]}}
      # ---- L1 ロジックダイ: データパス(左 → 右)----
      - {id: ifq, die: L1, at: [0, 2, 1, 1], name: 入力 FIFO, shape: fifo, info: ["スパインから"]}
      - {id: wsel, die: L1, at: [1, 2, 1, 1], name: 書き込み選択, shape: mux, pins: {w: ["0", "1"], n: [sel]}}
      - {id: asram, die: L1, at: [2, 1, 1, 3], name: 作業 SRAM, shape: ram, info: ["512b × 32768 語", "2 ポート・2MB"],
         pins: {w: [wdata], n: [waddr, raddr], e: [rdata]}}
      - {id: breg, die: L1, at: [3, 1, 1, 1], name: B REG, shape: reg, clock: clk_core, info: ["重み 2048b"], pins: {n: [d]}}
      - {id: areg, die: L1, at: [3, 2, 1, 1], name: A REG, shape: reg, clock: clk_core, info: ["512b"]}
      - {id: mul, die: L1, at: [4, 1, 1, 1], name: 乗算器 ×256, shape: op, sym: "×", info: ["8b × 8b"], pins: {w: [b], s: [a]}}
      - {id: add, die: L1, at: [5, 1, 1, 1], name: 加算木・累算, shape: op, sym: "+", info: ["→ 4 × 32b"], pins: {w: [x], n: [acc]}}
      - {id: shf, die: L1, at: [4, 2, 1, 1], name: シフタ, shape: op, sym: "≫", info: ["正規化"]}
      - {id: sat, die: L1, at: [5, 2, 1, 1], name: 丸め・飽和, info: ["→ 4 × 8b"]}
      - {id: relu, die: L1, at: [4, 3, 1, 1], name: ReLU, shape: op, sym: "max", info: ["max(0, x)"]}
      - {id: lut, die: L1, at: [5, 3, 1, 1], name: 活性化 LUT, shape: ram, info: ["ROM 256 語"]}
      - {id: osel, die: L1, at: [6, 1, 1, 3], name: 演算器選択, shape: mux, pins: {w: ["0", "1", "2"], n: [sel]}}
      - {id: acc, die: L1, at: [7, 2, 1, 1], name: 結果 REG, shape: reg, clock: clk_core, info: ["128b"]}
      - {id: ofq, die: L1, at: [8, 2, 1, 1], name: 出力 FIFO, shape: fifo, info: ["スパインへ"]}
    links:                       # from・to は「ブロック.端子」。同じ出力端子から出る線は 1 本の配線になり、分かれる所に ● が付く
      # ---- データ ----
      - {id: i1, from: ifq.out, to: wsel.0, width: 512, label: 入力}
      - {id: w1, from: wsel.y, to: asram.wdata, width: 512, label: wdata}
      - {id: r1, from: asram.rdata, to: areg.d, width: 512, label: rdata}
      - {id: a2, from: areg.q, to: shf, width: 512, label: A}
      - {id: a1, from: areg.q, to: mul.a, width: 512}
      - {id: a3, from: areg.q, to: relu, width: 512}
      - {id: b1, from: breg.q, to: mul.b, width: 2048, label: B}
      - {id: p1, from: mul.y, to: add.x, width: 4096, label: 積}
      - {id: m1, from: add.y, to: osel.0, width: 128, label: 積和}
      - {id: n0, from: shf.y, to: sat, width: 128}
      - {id: n1, from: sat, to: osel.1, width: 32, label: 正規化}
      - {id: c0, from: relu.y, to: lut, width: 32}
      - {id: c1, from: lut, to: osel.2, width: 32, label: 活性化}
      - {id: o1, from: osel.y, to: acc.d, width: 128}
      - {id: q1, from: acc.q, to: ofq.in, width: 128, label: 結果}
      - {id: wb, from: acc.q, to: wsel.1, width: 128, label: 書き戻し}
      - {id: f1, from: acc.q, to: add.acc, width: 128, label: 累算}
      - {id: bl, from: wcell, to: wsa, width: 2048, label: ビット線}
      - {id: hb, from: wsa.q, to: breg.d, via: HB, far: line, width: 2048, label: 重み}
      # ---- 制御(破線)----
      - {id: wl, from: wdecr, to: wcell, width: 16, label: 行選択, kind: ctrl}
      - {id: wa, from: agen.wadr, to: wdecr.addr, via: HB, far: line, width: 16, label: 重みアドレス, kind: ctrl}
      - {id: adw, from: agen.waddr, to: asram.waddr, width: 16, label: "waddr・we", kind: ctrl}
      - {id: adr, from: agen.raddr, to: asram.raddr, width: 15, label: raddr, kind: ctrl}
      - {id: s_ag, from: seq, to: agen, width: 8, label: 更新, kind: ctrl}
      - {id: s_op, from: seq.op_sel, to: osel.sel, width: 2, label: op_sel, kind: ctrl}
