# フロアプラン検討 (座標 µm / 原点ダイ左下)。ブロックIDは論理図(npu_soc.yaml)と揃える。
floorplan:
  title: NPU-SoC フロアプラン 案A
  unit: um
  die: null                 # 未定 → 使用率から見積もり
  core_margin: 200
  target_util: 0.55
  libs: [lib]
  drawio: {px_per_mm: 1000}
  blocks:
    - {id: pcie_phy, cell: PCIE_PHY_X4, side: W}
    - {id: eth_serdes, cell: ETH_SERDES, side: E}
    - {id: ddr_phy, cell: DDR_PHY_X32, side: S}
    - {id: cpu, cell: CPU_CLUSTER_2C}
    - {id: npu, kind: soft, area_mm2: 7.5, aspect: 1.3}
    - {id: lbuf, cell: SRAM_SP_16KX512, count: 2, near: npu}
    - {id: sram, cell: SRAM_SP_32KX128, count: 2}
    - {id: pll, cell: PLL_1G}
    - {id: npu_dsp, cell: DSP_IP_V2}
