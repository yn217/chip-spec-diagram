    scenes:
      - id: conv
        title: 動作 — 畳み込み 1 層(積和 → 書き戻し → 正規化 → 書き戻し → 活性化 → 出力)
        frames: true             # コマ割りの図も出す(同じ図を 1 ステップずつ)
        steps:                   # state = そのステップでの、セレクタの向き・メモリの読み書き・レジスタの動き(動作の表になる)
          - {text: "入力を作業 SRAM に書く(書き込み選択 = 0: 入力側)", links: [i1, s_ws, w1, adw],
             state: {wsel: "0: 入力", asram: W 入力}}
          - {text: "作業 SRAM から入力を A REG へ、重み SRAM(L2)から重みを B REG へ読む", links: [adr, r1, wa, wl, bl, hb],
             state: {asram: R 入力, wcell: R 重み}}
          - {text: "演算器選択 = 0: 積和。A×B を足し込み、結果 REG に累算する(2〜3 を畳み込みの窓の数だけくり返す)", links: [a1, b1, p1, m1, s_op, o1, f1],
             state: {osel: "0: 積和", acc: 累算}}
          - {text: "累算した値を作業 SRAM に書き戻す(書き込み選択 = 1: 結果側)", links: [wb, s_ws, w1, adw],
             state: {wsel: "1: 結果", asram: W 積和の結果, acc: 保持}}
          - {text: "書き戻した値を A REG へ読み直す", links: [adr, r1],
             state: {asram: R 積和の結果}}
          - {text: "演算器選択を 1: 正規化 に切り替える(シフト → 丸め・飽和)", links: [a2, n0, n1, s_op, o1],
             state: {osel: "1: 正規化", acc: 取り込み}}
          - {text: "正規化した値を作業 SRAM に書き戻す", links: [wb, s_ws, w1, adw],
             state: {wsel: "1: 結果", asram: W 正規化の結果, acc: 保持}}
          - {text: "もう一度読み、演算器選択を 2: 活性化 に切り替える(ReLU → LUT)", links: [adr, r1, a3, c0, c1, s_op, o1],
             state: {asram: R 正規化の結果, osel: "2: 活性化", acc: 取り込み}}
          - {text: "結果を出力 FIFO へ送る(次の層の入力にするなら、4 と同じく書き戻して続ける)", links: [q1],
             state: {acc: 出力}}
